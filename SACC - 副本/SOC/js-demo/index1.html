<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript 初体验</title>
</head>
<body>
    <h1>计数器</h1>
    <p>你点击了<span id="countDisplay">0</span>次</p>
    <button id="countBtn">点我 +1</button>
    <button id="countabc">点我 -1</button>
    <button id="resetbtn">归零</button>
    
   <script>
     const btn =document.querySelector("#countBtn");
        const display = document.querySelector("#countDisplay");
        const resetBtn = document.querySelector("#resetbtn");
        const abcbtn =document.querySelector("#countabc");
        let count = 0;
        btn.addEventListener("click",function(){
            count = count + 1;
            display.textContent = count;    
        })
        abcbtn.addEventListener("click",function(){
            if(count>0){
                count = count - 1;
                display.textContent = count;
            }
        })
        resetBtn.addEventListener("click",function(){
            count = 0;
            display.textContent = count;
        })
   </script>
</body>
</html>
